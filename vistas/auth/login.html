{% extends "base.html" %}
{% from "macros.html" import csrf %}
{% block contenido %}
<div class="centro"><div class="logo">PR</div><h2>Iniciar sesión</h2>
<p class="suave">Ingrese con su usuario y contraseña</p></div>
<form method="post" class="formulario">
  {{ csrf() }}
  <label for="usuario">Usuario</label>
  <input id="usuario" name="usuario" maxlength="70" placeholder="Ej. mesero1" value="{{ username }}" autocomplete="username">
  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password" placeholder="Mínimo 8 caracteres" autocomplete="current-password">
  {% if error %}<div class="aviso error" role="alert">{{ error }}</div>{% endif %}
  <button class="boton">Ingresar</button>
</form>
<p class="suave centro pie">¿Cuenta inactiva? Contacte al administrador.</p>
{% endblock %}
